# xuedizi/starter-android-kotlin/adapter.yaml
#
# 被子项目 .tac/adapter.yaml `extends: xuedizi/starter-android-kotlin#v0.1.0` 继承。
# 子项目只需 override 自己关心的字段(典型只填 gateway.url)。

schema_version: "1"
kind: StarterPack
name: starter-android-kotlin
version: 0.1.0
project_type: android-kotlin
maintainers:
  - lcycrchao@gmail.com

paths:
  spec_dir: specs
  src_dir: app/src/main
  test_dir: app/src/test
  resource_dir: app/src/main/res

commands:
  test: "./gradlew test"
  lint: "./gradlew ktlintCheck"
  typecheck: "./gradlew compileDebugKotlin"
  build: "./gradlew assembleDebug"
  unit_test: "./gradlew testDebugUnitTest"
  instrumentation_test: "./gradlew connectedAndroidTest"
  clean: "./gradlew clean"

architecture:
  layers: [ui, domain, data]
  module_layout: single-module
  di: hilt
  async: coroutines
  ui_framework: compose

linting:
  ktlint:
    enabled: true
    version: "1.3.0"
  detekt:
    enabled: false

gateway:
  url: ""   # 子项目 override

# 推荐的 APM 原语组合 —— 与本 starter v0.1.0 经过验证可配套
recommended_apm:
  skills:
    - xuedizi/tac-skills/skills/tac-spec-flow#v0.1.0
    - xuedizi/tac-skills/skills/tac-clarify-flow#v0.1.0
    - xuedizi/tac-skills/skills/tac-plan-flow#v0.1.0
    - xuedizi/tac-skills/skills/tac-tasks-flow#v0.1.0
    - xuedizi/tac-skills/skills/tac-implement-flow#v0.1.0
    - xuedizi/tac-skills/skills/tac-gate-flow#v0.1.0
    - xuedizi/tac-skills/skills/tac-commit-flow#v0.1.0
    - xuedizi/tac-skills/skills/tac-pr-flow#v0.1.0
    - xuedizi/tac-skills/skills/tac-metrics-flow#v0.1.0
  agents:
    - xuedizi/tac-skills/agents/spec-writer.agent.md#v0.1.0
    - xuedizi/tac-skills/agents/plan-author.agent.md#v0.1.0
    - xuedizi/tac-skills/agents/tdd-implementer.agent.md#v0.1.0
    - xuedizi/tac-skills/agents/gate-runner.agent.md#v0.1.0
    - xuedizi/tac-skills/agents/commit-reviewer.agent.md#v0.1.0
  commands:
    - xuedizi/tac-skills/commands/tac.gate#v0.1.0
    - xuedizi/tac-skills/commands/tac.commit#v0.1.0
    - xuedizi/tac-skills/commands/tac.pr#v0.1.0

recommended_policy: xuedizi/apm-policy#v1.0.0
