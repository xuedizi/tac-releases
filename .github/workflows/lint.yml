name: lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: sudo snap install yq || (sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq)
      - name: required fields
        run: |
          for f in schema_version kind name version project_type paths commands architecture; do
            yq -e ".$f" adapter.yaml >/dev/null || { echo "missing: $f"; exit 1; }
          done
      - name: version coherence
        run: |
          VER=$(cat VERSION)
          AVER=$(yq '.version' adapter.yaml)
          [ "$VER" = "$AVER" ] || { echo "VERSION=$VER != adapter.yaml version=$AVER"; exit 1; }
      - name: recommended pins point to xuedizi/*
        run: |
          yq '.recommended_apm.skills[], .recommended_apm.agents[], .recommended_apm.commands[], .recommended_policy' adapter.yaml \
            | grep -v '^xuedizi/' && { echo "FAIL: non-xuedizi reference"; exit 1; } || true
      - name: all recommended refs have #vX.Y.Z pin
        run: |
          yq '.recommended_apm.skills[], .recommended_apm.agents[], .recommended_apm.commands[], .recommended_policy' adapter.yaml \
            | grep -v '#v' && { echo "FAIL: unpinned reference"; exit 1; } || true
